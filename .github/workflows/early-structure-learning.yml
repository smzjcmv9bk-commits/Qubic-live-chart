name: Early Structure Learning Fallback
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: early-structure-learning-fallback
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record and score early structures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/early-structure-worker.mjs

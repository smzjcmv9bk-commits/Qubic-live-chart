name: V9 24x7 Learning
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v9-loader.js'
      - 'prediction-v9.js'
      - 'api/avwap-signal.js'
      - 'api/mobile-learning.js'
      - 'scripts/learning-worker.mjs'
      - '.github/workflows/v9-learning.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v9-learning
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run V9 learner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/learning-worker.mjs

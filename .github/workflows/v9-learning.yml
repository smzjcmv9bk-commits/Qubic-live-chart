name: Unified Qubic 24x7 Learning
on:
  push:
    branches: [main]
    paths:
      - 'v9-loader.js'
      - 'prediction-v9.js'
      - 'v10-dashboard.js'
      - 'pattern-intelligence.js'
      - 'avwap-intelligence.js'
      - 'api/active-candles.js'
      - 'api/orderbook.js'
      - 'api/live-trades.js'
      - 'api/market-summary.js'
      - 'api/avwap-signal.js'
      - 'api/pattern-scan.js'
      - 'api/ant-score.js'
      - 'api/network-status.js'
      - 'api/mobile-learning.js'
      - 'api/v10-learning.js'
      - 'api/early-learning.js'
      - 'api/grouped-shadow.js'
      - 'scripts/learning-worker.mjs'
      - 'scripts/grouped-signal-shadow-worker.mjs'
      - 'scripts/v10-challenger-worker.mjs'
      - 'scripts/early-structure-worker.mjs'
      - '.github/workflows/v9-learning.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unified-qubic-learning
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run unified market learner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/learning-worker.mjs
      - name: Run grouped signal shadow learner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/grouped-signal-shadow-worker.mjs
      - name: Run V10 evolutionary challenger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/v10-challenger-worker.mjs
      - name: Run early structure learner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/early-structure-worker.mjs

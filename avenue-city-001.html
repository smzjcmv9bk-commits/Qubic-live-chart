<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE AVENUE CITY 001</title><style>*{box-sizing:border-box}body{margin:0;background:#02050b;color:#eefcff;font-family:Arial,sans-serif}.w{max-width:1180px;margin:auto;padding:14px}.top,.shell{border:1px solid #5eeaff44;background:#06101b;border-radius:18px}.top{padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.22em}.live{color:#7fffd4;font-size:11px}.hero{padding:30px 4px 15px}.hero h1{font-size:42px;line-height:.95;margin:7px 0}.cyan{color:#72edff}.muted{font-size:11px;color:#8396aa}.stats{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.stat{min-width:130px;flex:1;padding:10px;border:1px solid #5eeaff22;border-radius:11px;background:#07111d}.stat b{display:block;font-size:20px;margin-top:4px}.shell{overflow:hidden}.head{padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.btn{border:1px solid #64edff66;background:#0b2633;color:#8ff7ff;padding:9px 12px;border-radius:9px;font-weight:bold}.view{height:620px;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 30%,#112d46,#030812 65%)}.city{position:absolute;width:900px;height:900px;left:50%;top:40px;margin-left:-450px;transform:rotateX(58deg) rotateZ(45deg);transform-origin:center;background:#06101a;border:1px solid #5eeaff33;box-shadow:0 0 80px #0de7ff16 inset}.roadV,.roadH{position:absolute;background:#010309;box-shadow:0 0 10px #5eeaff22}.roadV{width:46px;height:100%;left:427px}.roadH{height:46px;width:100%;top:427px}.block{position:absolute;border:1px solid var(--c);background:#07111d;box-shadow:0 0 22px color-mix(in srgb,var(--c) 15%,transparent) inset}.tower{position:absolute;width:28px;height:28px;background:#0d2532;border:1px solid #62eaff66;box-shadow:0 0 9px #46e6ff33;cursor:pointer}.tower:after{content:'';position:absolute;left:4px;top:4px;width:18px;height:18px;background:#153d50;box-shadow:0 0 8px #60edff55}.tower.reserved{background:#6e5120;border-color:#ffc766}.tower.claimed{background:#583878;border-color:#c88cff}.label{position:absolute;color:var(--c);font-size:10px;font-weight:900;letter-spacing:.1em;transform:rotateZ(-45deg) rotateX(-58deg);white-space:nowrap}.core{position:absolute;left:405px;top:405px;width:90px;height:90px;border-radius:50%;border:4px solid #72f5ff;background:#0cf5ff22;box-shadow:0 0 55px #16eaff}.legend{position:absolute;left:10px;bottom:10px;background:#020711dd;border:1px solid #5eeaff44;padding:9px;border-radius:9px;font-size:9px}.zoom{position:absolute;right:10px;bottom:10px;display:grid;gap:5px}.zoom button{width:40px;height:40px}.sheetbg{display:none;position:fixed;inset:0;background:#000c;z-index:9;place-items:end center}.sheetbg.open{display:grid}.sheet{width:min(560px,100%);padding:20px;background:#08131f;border:1px solid #65efff55;border-radius:20px 20px 0 0}@media(max-width:700px){.hero h1{font-size:34px}.view{height:570px}.city{top:80px;transform:scale(.72) rotateX(58deg) rotateZ(45deg)}.brand{font-size:14px}}</style></head><body><div class="w"><div class="top"><div class="brand">THE AVENUE</div><div id="live" class="live">● STARTING</div></div><div class="hero"><div class="cyan">CITY 001 · GENESIS METROPOLIS</div><h1>ENTER THE<br><span class="cyan">DIGITAL CITY.</span></h1><div class="muted">A visual city layer driven by real Avenue plot records.</div></div><div class="stats"><div class="stat">CLAIMED<b id="cl">0</b></div><div class="stat">AVAILABLE<b id="av">2500</b></div><div class="stat">DISTRICTS<b id="di">8</b></div><div class="stat">ENTRY<b id="pr">£5</b></div></div><div class="shell"><div class="head"><div><b>CITY 001 · LIVE METROPOLIS</b><div id="st" class="muted">Connecting…</div></div><button id="refresh" class="btn">REFRESH</button></div><div class="view" id="view"><div class="city" id="city"><div class="roadV"></div><div class="roadH"></div><div class="core"></div></div><div class="legend">CYAN AVAILABLE · PURPLE CLAIMED · GOLD RESERVED<br>Drag to explore · tap structures</div><div class="zoom"><button class="btn" id="zin">+</button><button class="btn" id="zout">−</button></div></div></div></div><div class="sheetbg" id="panel"><div class="sheet"><div id="pd" class="cyan"></div><h2 id="pt"></h2><p id="px" class="muted"></p><button class="btn" style="width:100%" onclick="panel.classList.remove('open')">BACK TO CITY</button></div></div><script>const B='https://yohelicrshdmciyxlvii.supabase.co',K='sb_publishable_TtDM119EOFXJ34AslKKKfw_zZ5DNN3h',H={apikey:K,Authorization:'Bearer '+K},D=[['BUSINESS','#67e8f9'],['CREATORS','#c084fc'],['AI + TECH','#22d3ee'],['GAMING','#4ade80'],['CULTURE','#fb7185'],['LOCAL','#facc15'],['FOOD','#fb923c'],['CRYPTO','#a78bfa']];let zoom=1,dx=0,dy=0,drag=false,sx=0,sy=0;async function j(p){let r=await fetch(B+'/rest/v1/'+p,{headers:H,cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}async function cnt(s){let r=await fetch(B+'/rest/v1/plots?city_no=eq.1&status=eq.'+s+'&select=id',{method:'HEAD',headers:{...H,Prefer:'count=exact'}});return +(r.headers.get('content-range')||'0/0').split('/')[1]}function base(){D.forEach((d,i)=>{let col=i%2,row=Math.floor(i/2),b=document.createElement('div');b.className='block';b.style.cssText='--c:'+d[1]+';left:'+(col?473:20)+'px;top:'+(row*105+12)+'px;width:407px;height:88px';city.appendChild(b);let l=document.createElement('div');l.className='label';l.style.cssText='--c:'+d[1]+';left:'+(col?490:38)+'px;top:'+(row*105+28)+'px';l.textContent=d[0];city.appendChild(l)})}function tower(p){let n=(p.plot_no-1)%500,row=Math.floor(n/50),col=n%50,x=28+col*16.7,y=35+row*39;if(col>24)x+=48;if(row>4)y+=48;let t=document.createElement('div');t.className='tower '+p.status;t.style.left=x+'px';t.style.top=y+'px';t.onclick=e=>{e.stopPropagation();let d=Math.min(7,Math.floor(n/63));pd.textContent=D[d][0]+' DISTRICT';pt.textContent=p.brand_name||'Plot '+p.plot_no;px.textContent=p.status==='available'?'Available '+p.tier+' plot. This location can become a real Avenue building.':p.status==='reserved'?'This location is temporarily reserved.':'Claimed building · '+(p.tagline||'Public business profile.');panel.classList.add('open')};city.appendChild(t)}async function load(){live.textContent='● CONNECTING';st.textContent='Loading real city records…';document.querySelectorAll('.tower').forEach(x=>x.remove());try{let [p,d,r,c,q]=await Promise.all([j('plots?city_no=eq.1&select=plot_no,status,tier,brand_name,tagline&order=plot_no&limit=500'),j('districts?select=is_open'),j('pricing_rules?is_active=eq.true&select=tier,amount_pence'),cnt('claimed'),cnt('reserved')]);cl.textContent=c;av.textContent=2500-c-q;di.textContent=d.filter(x=>x.is_open).length;let f=r.find(x=>x.tier==='founding');pr.textContent=f?'£'+f.amount_pence/100:'—';p.forEach(tower);live.textContent='● LIVE CITY';st.textContent='500 real locations rendered · '+q+' reserved city-wide'}catch(e){live.textContent='● CONNECTION ERROR';st.textContent='Could not load city · tap REFRESH'}}function tf(){city.style.marginLeft=(-450+dx)+'px';city.style.marginTop=dy+'px';city.style.scale=zoom}base();refresh.onclick=load;zin.onclick=()=>{zoom=Math.min(1.6,zoom+.15);tf()};zout.onclick=()=>{zoom=Math.max(.65,zoom-.15);tf()};view.onpointerdown=e=>{drag=true;sx=e.clientX-dx;sy=e.clientY-dy};view.onpointermove=e=>{if(drag){dx=e.clientX-sx;dy=e.clientY-sy;tf()}};view.onpointerup=()=>drag=false;load();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE AVENUE</title><style>body{margin:0;background:#030711;color:#eefcff;font-family:Arial,sans-serif}.w{max-width:1100px;margin:auto;padding:22px}.top,.city,.c{border:1px solid #65eaff35;background:#08111d;border-radius:18px}.top{padding:18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.2em}.live{color:#7fffd4;font-size:12px}.hero{padding:48px 8px 25px}.hero h1{font-size:50px;line-height:.96;margin:12px 0}.cyan{color:#70efff}.muted{color:#8295a8;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{padding:18px}.c b{display:block;font-size:26px;margin-top:8px}.city{margin-top:18px;padding:18px}.bar{display:flex;justify-content:space-between;align-items:center}.btn{padding:10px 14px;border-radius:10px;border:1px solid #70efff66;background:#0d2431;color:#8ef5ff;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;margin-top:18px}.p{aspect-ratio:1;background:#0b1c28;border:1px solid #69efff22}.p.reserved{background:#f0b44c88}.p.claimed{background:#735cff88}@media(max-width:700px){.hero h1{font-size:38px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(10,1fr)}.brand{font-size:15px}}</style></head><body><div class="w"><div class="top"><div class="brand">THE AVENUE</div><div><span id="live" class="live">● STARTING</span> <button id="sign" class="btn">SIGN IN</button></div></div><div class="hero"><div class="cyan">CITY 001 · LIVE FOUNDATION</div><h1>BUILD YOUR PLACE<br><span class="cyan">ON THE INTERNET.</span></h1><p class="muted">Live city inventory loads directly from THE AVENUE database, including on mobile browsers.</p></div><div class="stats"><div class="c"><span class="muted">PLOTS CLAIMED</span><b id="cl">0</b><span class="muted">/ 2,500</span></div><div class="c"><span class="muted">AVAILABLE</span><b id="av">2500</b><span class="muted">LIVE DATABASE</span></div><div class="c"><span class="muted">DISTRICTS</span><b id="di">8</b><span class="muted">OPEN</span></div><div class="c"><span class="muted">FOUNDING PRICE</span><b id="pr">£5</b><span class="muted">GBP</span></div></div><div class="city"><div class="bar"><div><b>CITY 001 · PLOT MAP</b><div id="st" class="muted">Connecting…</div></div><button id="refresh" class="btn">REFRESH</button></div><div id="grid" class="grid"></div></div></div><script>const B='https://yohelicrshdmciyxlvii.supabase.co',K='sb_publishable_TtDM119EOFXJ34AslKKKfw_zZ5DNN3h',H={'apikey':K,'Authorization':'Bearer '+K};const E=x=>document.getElementById(x);async function j(path){let r=await fetch(B+'/rest/v1/'+path,{headers:H,cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}async function count(status){let r=await fetch(B+'/rest/v1/plots?city_no=eq.1&status=eq.'+status+'&select=id',{method:'HEAD',headers:{...H,'Prefer':'count=exact'},cache:'no-store'});let cr=r.headers.get('content-range')||'0/0';return Number(cr.split('/')[1]||0)}async function load(){E('live').textContent='● CONNECTING';E('st').textContent='Loading live city…';try{let [p,d,r,c,q]=await Promise.all([j('plots?city_no=eq.1&select=plot_no,status&order=plot_no&limit=500'),j('districts?select=is_open'),j('pricing_rules?is_active=eq.true&select=tier,amount_pence'),count('claimed'),count('reserved')]);E('cl').textContent=c;E('av').textContent=2500-c-q;E('di').textContent=d.filter(x=>x.is_open).length;let f=r.find(x=>x.tier==='founding');E('pr').textContent=f?'£'+f.amount_pence/100:'—';E('grid').innerHTML='';p.forEach(x=>{let z=document.createElement('div');z.className='p '+x.status;z.title='Plot '+x.plot_no+' · '+x.status;E('grid').appendChild(z)});E('st').textContent='500 live plots loaded · '+q+' reserved city-wide';E('live').textContent='● LIVE DATABASE'}catch(e){E('live').textContent='● CONNECTION ERROR';E('st').textContent='Could not reach city database. Tap REFRESH.'}}E('refresh').onclick=load;E('sign').onclick=()=>alert('City connection is now independent. Account sign-in is being reattached next.');load();setTimeout(()=>{if(E('live').textContent.includes('CONNECTING')){E('st').textContent='Connection is taking longer than expected. Tap REFRESH.'}},6000);</script></body></html>
